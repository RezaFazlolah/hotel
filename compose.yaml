services:
  postgres:
    image: postgres:18
    container_name: postgresContainer
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
  seq:
    image: datalust/seq:2026.1
    container_name: seqContainer
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD}
    ports:
      - "5341:80"
    volumes:
      - seq_data:/data
  reids:
    image: redis:8.2
    container_name: redisContainer
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  seq_data:
  redis_data: